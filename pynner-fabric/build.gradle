plugins { id 'fabric-loom' version '1.14.10' }
version = '0.1.0'
group = 'net.nehaverse.pynner'
base { archivesName = 'pynner-debug-fabric' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.4:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { withSourcesJar() }
processResources { inputs.property 'version', version; filesMatching('fabric.mod.json') { expand version: version } }
loom { runs { client { programArgs '--username', 'PynnerDev', '--width', '960', '--height', '540' } } }
