[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pynner-runtime"
version = "0.1.0"
description = "Supervised CPython worker for Pynner"
requires-python = ">=3.11"
dependencies = ["pynner==0.1.0", "msgpack>=1.1,<2"]

[project.scripts]
pynner-runtime = "pynner_runtime.__main__:main"
