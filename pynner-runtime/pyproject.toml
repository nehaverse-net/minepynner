[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minepynner-runtime"
version = "0.1.0"
description = "Supervised CPython worker for Pynner"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["minecraft", "paper", "plugins", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
]

authors = [{name = "grampr"}]
dependencies = ["minepynner==0.1.0", "msgpack>=1.1,<2"]

[project.urls]
Homepage = "https://github.com/nehaverse-net/minepynner"
Repository = "https://github.com/nehaverse-net/minepynner"
Documentation = "https://github.com/nehaverse-net/minepynner/tree/main/docs"
Issues = "https://github.com/nehaverse-net/minepynner/issues"

[project.scripts]
pynner-runtime = "pynner_runtime.__main__:main"
