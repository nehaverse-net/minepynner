[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minepynner"
version = "0.1.0"
description = "Typed CPython SDK for the Pynner Paper plugin framework"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["minecraft", "paper", "plugins", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
]

authors = [{name = "grampr"}]

[project.urls]
Homepage = "https://github.com/nehaverse-net/minepynner"
Repository = "https://github.com/nehaverse-net/minepynner"
Documentation = "https://github.com/nehaverse-net/minepynner/tree/main/docs"
Issues = "https://github.com/nehaverse-net/minepynner/issues"

[project.optional-dependencies]
debug = ["minepynner-debug==0.1.0"]
server = ["minepynner-runtime==0.1.0"]

[tool.setuptools.package-data]
pynner = ["py.typed"]
